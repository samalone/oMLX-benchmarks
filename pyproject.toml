[project]
name = "omlxbench"
version = "0.1.0"
description = "Background benchmark recorder for a local oMLX server"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
omlxbench = "omlxbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
