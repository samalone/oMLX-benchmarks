# What omlxbench should measure. Edit freely: adding a test or model creates
# new work; removing one only stops future runs (stored results are kept).
#
# Each [[benchmarks]] block may hold `perf`, `accuracy`, `context`, `tools`,
# `agent_turns`, `pulse_memory` and/or `stream_perf` tables, and optionally
# `models` / `exclude_models` globs that narrow it. Lower tiers are completed
# for every model before any higher tier starts.
#
# `engines` (default ["omlx"]) says which inference engines a block runs on:
# "omlx" and/or "tensorfold". Only one engine runs at a time; the runner plans
# for whichever is up. perf, accuracy and context use oMLX's built-in
# benchmarks, so they are oMLX-only; the rest run through the chat API on any
# engine.
#
# Priorities follow how the models are used: mainly with Hermes Agent, which
# needs >= 64k context and tool calling, runs with thinking on
# (reasoning_effort: medium), and sends ~60k-token prompts that are mostly
# prefix-cached (from oMLX usage history, 2026-10-02).

[runner]
quiet_minutes = 10        # no API traffic for this long before a run starts

[models]
include = ["*"]           # glob patterns against oMLX model ids
# clef-flash is not a chat model: it can't be driven through the chat API.
# The GGUF models go to Splash, which (since 2026-10-30) serves only the
# Qwen3.8-27B, Qwen3.6-35B-A3B and Qwen3.8-Flash-Next families, so these
# four fail to load (HTTP 409). Their earlier results are kept.
exclude = [
    "clef-flash-*",
    "Jan-v1-4B-Q4_K_M",
    "medgemma-1.5-4b-it-Q4_K_S",
    "Qwen3-30B-A3B-abliterated-erotic.i1-Q4_K_S",
    "nicoboss.Qwen3-32B-Uncensored.Q4_K_S",
]
types = ["llm", "vlm"]

# Tier 1 (done for all models): the oMLX web UI defaults, a quick speed
# baseline.
[[benchmarks]]
tier = 1
perf = { prompt_lengths = [1024, 4096], batch_sizes = [2, 4], context_profile = "code_python" }

# Tier 2: speed and memory at Hermes-sized contexts, and the largest prompt
# that actually fits in memory. agent_turns replays a Hermes-shaped session
# (20k-token start, then ~4k new tokens per step up to ~64k, prefix-cached)
# and times every step: the closest number to how Hermes feels.
[[benchmarks]]
tier = 2
perf = { prompt_lengths = [16384, 32768, 65536] }
agent_turns = { enable_thinking = true }
context = { target_tokens = 131072 }
# Devstral ran at 15 tok/s at 4k context in tier 1: far too slow for an agent.
exclude_models = ["Devstral-*"]

# Sampling: since 2026-10-02 every model has its recommended temperature /
# top_p / top_k saved in oMLX's per-model settings (from its
# generation_config.json; Qwen-family thinking values where the model shipped
# none or non-thinking ones). Hermes sends no sampling parameters, so it gets
# these; the suites below use them too ("model_settings" / no overrides).
# Greedy decoding with thinking on makes Qwen-family models loop.

# Tier 3: tool calling (BFCL v3) through oMLX's chat API with thinking on,
# exactly as Hermes calls the model. The criterion that matters most.
[[benchmarks]]
tier = 3
tools = { categories = { simple = 40, multiple = 40, parallel = 40, parallel_multiple = 40, irrelevance = 40 }, enable_thinking = true }
# Pulse memory: the JSON-output request Hermes's Pulse plugin makes
# (response_format json_object, no thinking flag), 13 synthetic chats, each
# 3 times since failures are intermittent. Added 2026-11-04 after
# Ornith-1.5-35B-A3B-Abliterated returned wrong-shaped JSON (`[1]`, a bare
# item) for about two Pulse calls in three.
pulse_memory = { repeats = 3 }
exclude_models = ["Devstral-*"]

# Tier 4: capability in the mode Hermes uses (thinking on). Comparing the
# abliterated/uncensored variants with their siblings shows what uncensoring
# costs.
[[benchmarks]]
tier = 4
accuracy = { suites = { gsm8k = 100, mmlu_pro = 300, humaneval = 0, mbpp = 200 }, enable_thinking = true, sampling_profile = "model_settings" }
exclude_models = ["Devstral-*"]

# Later, for finalists only (thinking on, ~16k tokens per question):
# [[benchmarks]]
# tier = 6
# accuracy = { suites = { livecodebench = 100 }, enable_thinking = true }
# models = ["..."]

# TensorFold (2026-11-12). It shares no loadable model with oMLX (the two
# it listed as compatible fail to load), so it is compared across models:
# its Nemotron Lightning against the oMLX models, on the chat-API suites,
# whose results are directly comparable across engines. It serves one model
# at a time (switch it in its app); `omlxbench status` says what it needs.
#
# Its sampling comes from the model's generation_config.json (oMLX has no
# saved settings for it). stream_perf is a client-side speed test, timed by
# omlxbench; oMLX models only have oMLX's own perf numbers, which are measured
# differently, so add `engines = ["omlx"]` + stream_perf for a fair speed
# comparison.
[[benchmarks]]
tier = 2
engines = ["tensorfold"]
models = ["NVIDIA-Nemotron-3.5-Lightning-30B-A3B-MLX-4bit"]
stream_perf = { prompt_lengths = [1024, 4096, 16384, 32768, 65536] }
agent_turns = { enable_thinking = true }

[[benchmarks]]
tier = 3
engines = ["tensorfold"]
models = ["NVIDIA-Nemotron-3.5-Lightning-30B-A3B-MLX-4bit"]
tools = { categories = { simple = 40, multiple = 40, parallel = 40, parallel_multiple = 40, irrelevance = 40 }, enable_thinking = true }
pulse_memory = { repeats = 3 }
