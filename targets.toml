# What omlxbench should measure. Edit freely: adding a test or model creates
# new work; removing one only stops future runs (stored results are kept).
#
# Each [[benchmarks]] block may hold `perf`, `accuracy`, `context` and/or `tools`
# tables, and optionally `models` / `exclude_models` globs that narrow it.
# Lower tiers are completed for every model before any higher tier starts.
#
# Priorities follow how the models are used: mainly with Hermes Agent, which
# needs >= 64k context and tool calling, runs with thinking on
# (reasoning_effort: medium), and sends ~60k-token prompts that are mostly
# prefix-cached (from oMLX usage history, 2026-10-02).

[runner]
quiet_minutes = 10        # no API traffic for this long before a run starts

[models]
include = ["*"]           # glob patterns against oMLX model ids
exclude = []
types = ["llm", "vlm"]

# Tier 1 (done for all models): the oMLX web UI defaults, a quick speed
# baseline.
[[benchmarks]]
tier = 1
perf = { prompt_lengths = [1024, 4096], batch_sizes = [2, 4], context_profile = "code_python" }

# Tier 2: speed and memory at Hermes-sized contexts, and the largest prompt
# that actually fits in memory.
[[benchmarks]]
tier = 2
perf = { prompt_lengths = [16384, 32768, 65536] }
context = { target_tokens = 131072 }
# Devstral ran at 15 tok/s at 4k context in tier 1: far too slow for an agent.
exclude_models = ["Devstral-*"]

# Sampling: since 2026-10-02 every model has its recommended temperature /
# top_p / top_k saved in oMLX's per-model settings (from its
# generation_config.json; Qwen-family thinking values where the model shipped
# none or non-thinking ones). Hermes sends no sampling parameters, so it gets
# these; the suites below use them too ("model_settings" / no overrides).
# Greedy decoding with thinking on makes Qwen-family models loop.

# Tier 3: tool calling (BFCL v3) through oMLX's chat API with thinking on,
# exactly as Hermes calls the model. The criterion that matters most.
[[benchmarks]]
tier = 3
tools = { categories = { simple = 40, multiple = 40, parallel = 40, parallel_multiple = 40, irrelevance = 40 }, enable_thinking = true }
exclude_models = ["Devstral-*"]

# Tier 4: capability in the mode Hermes uses (thinking on). Comparing the
# abliterated/uncensored variants with their siblings shows what uncensoring
# costs.
[[benchmarks]]
tier = 4
accuracy = { suites = { gsm8k = 100, mmlu_pro = 300, humaneval = 0, mbpp = 200 }, enable_thinking = true, sampling_profile = "model_settings" }
exclude_models = ["Devstral-*"]

